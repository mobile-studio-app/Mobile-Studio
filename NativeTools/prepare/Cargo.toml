[package]
name = "duocode-prepare"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Turns a macOS ARM64 program into a library Mobile Studio can load on iOS, signed with the user's certificate."

[lib]
name = "duocode_prepare"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "prepare"
path = "src/bin/prepare.rs"

[dependencies]
apple-codesign = { version = "0.29.0", default-features = false }
p12-keystore = "0.2.1"
x509-certificate = "0.24.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
