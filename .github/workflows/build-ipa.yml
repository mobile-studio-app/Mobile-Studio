name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["tools/**", "**.md"]
  pull_request:
    paths-ignore: ["tools/**", "**.md"]
  workflow_dispatch:
    inputs:
      runner:
        description: Mac runner (Intel by default; the fallback job picks Apple silicon when Intel runners are all busy)
        type: choice
        options: [macos-15-intel, macos-15]
        default: macos-15-intel

# A newer push to the same ref makes the older build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node.js for iOS with ICU, built from source in two cached halves: compiling (about 25
  # minutes; scripts/compile-nodejs.sh) and linking the framework (scripts/build-nodejs.sh).
  # Once the framework is cached this job only checks for it. Its own job: it needs an older
  # Xcode than the app.
  node:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check for a built Node.js
        id: node-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/nodejs-mobile
          key: nodejs-mobile-icu-${{ hashFiles('scripts/compile-nodejs.sh', 'scripts/build-nodejs.sh', 'scripts/patch-nodejs-host-tools.py', 'scripts/patch-zerofill-offsets.py') }}
          lookup-only: true

      - name: Restore compiled Node.js libraries
        id: libs-cache
        if: steps.node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: third_party/nodejs-libs
          key: nodejs-libs-${{ hashFiles('scripts/compile-nodejs.sh', 'scripts/patch-nodejs-host-tools.py') }}

      # Node 18's build scripts use parts of Python newer releases removed.
      - uses: actions/setup-python@v5
        if: steps.node-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      # The oldest Xcode 16 on the image: Clang from Xcode 26 rejects parts of V8 10.2.
      - name: Select Xcode 16
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: |
          ls -d /Applications/Xcode*.app
          for v in 16.0 16.1 16.2 16.3 16.4; do
            if [ -d "/Applications/Xcode_$v.app" ]; then sudo xcode-select -s "/Applications/Xcode_$v.app"; break; fi
          done
          xcodebuild -version

      # Node.js, V8 and ICU need more room than the runner has free; the other Xcodes,
      # simulators and Android tools aren't used here.
      - name: Free disk space
        if: steps.node-cache.outputs.cache-hit != 'true' && steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          df -h /
          selected="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          for app in /Applications/Xcode*.app; do
            [ "$(cd "$app" && pwd -P)" = "$selected" ] || sudo rm -rf "$app"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/powershell /Library/Developer/CoreSimulator/Profiles/Runtimes
          df -h /

      - name: Compile Node.js
        if: steps.node-cache.outputs.cache-hit != 'true' && steps.libs-cache.outputs.cache-hit != 'true'
        run: bash scripts/compile-nodejs.sh

      # Saved straight away, so a problem linking doesn't mean compiling again.
      - name: Save compiled Node.js libraries
        if: steps.node-cache.outputs.cache-hit != 'true' && steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/nodejs-libs
          key: nodejs-libs-${{ hashFiles('scripts/compile-nodejs.sh', 'scripts/patch-nodejs-host-tools.py') }}

      - name: Link Node.js
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-nodejs.sh

      - name: Save Node.js
        if: steps.node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/nodejs-mobile
          key: nodejs-mobile-icu-${{ hashFiles('scripts/compile-nodejs.sh', 'scripts/build-nodejs.sh', 'scripts/patch-nodejs-host-tools.py', 'scripts/patch-zerofill-offsets.py') }}

  # The editor's browser tests (Editor/tests): the real editor page in headless Chrome with the
  # app faked. A failing test stops the build. Also warns when the committed bundle is out of date.
  editor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Editor/package-lock.json
      - name: Install
        working-directory: Editor
        run: npm ci
      - name: Build the editor
        working-directory: Editor
        run: |
          npm run build
          git diff --quiet -- ../App/Resources/Editor || echo "::warning::App/Resources/Editor differs from a fresh build of Editor/src: run npm run build and commit it."
      - name: Browser tests
        working-directory: Editor
        run: npm test

  build:
    needs: [node, editor-tests]
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    permissions:
      contents: write   # releases for version tags
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Xcode 26 has the iOS 26 SDK, which Apple Intelligence (FoundationModels) needs.
      - name: Select Xcode
        run: |
          # Xcode 26.3, or the newest Xcode 26 the image has (the Intel image can lag behind).
          xcode=/Applications/Xcode_26.3.app
          [ -d "$xcode" ] || xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # libgit2, the app's git, for iOS and this Mac (its tests), cached on the pinned version.
      - name: Restore libgit2
        id: libgit2-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/libgit2
          key: libgit2-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-libgit2.sh

      - name: Save libgit2
        if: steps.libgit2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/libgit2
          key: libgit2-${{ hashFiles('scripts/build-libgit2.sh') }}

      # The git tests run first: they take seconds and stop the build if, say, a checkout leaves
      # files looking changed, a merge loses a change or a push doesn't arrive.
      - name: Test git engine
        run: |
          swiftc -swift-version 5 -I third_party/libgit2/include -L third_party/libgit2/macos \
            App/Git/Git.swift App/Git/GitRepository.swift App/Git/GitGraph.swift App/Git/GitCommandLine.swift App/Git/KeychainStore.swift \
            App/Settings/JSONC.swift App/AI/ConflictResolver.swift App/Extensions/ExtensionCompatibility.swift Tests/GitEngine/*.swift \
            -o "$RUNNER_TEMP/git-tests"
          "$RUNNER_TEMP/git-tests"

      - name: Install tools
        run: brew install xcodegen xcbeautify

      # LÖVE 12 takes a while to compile, so it is cached on the pinned commits in
      # build-love-ios.sh. Saved right after it builds, even if the app build later fails.
      - name: Restore LÖVE 12 build
        id: love-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/love12-ios
          key: love12-ios-${{ hashFiles('scripts/build-love-ios.sh') }}

      - name: Build LÖVE 12 for iOS
        if: steps.love-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-love-ios.sh

      - name: Save LÖVE 12 build
        if: steps.love-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/love12-ios
          key: love12-ios-${{ hashFiles('scripts/build-love-ios.sh') }}

      - name: Restore llama.cpp
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/llama
          key: llama-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Fetch llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-llama.sh

      - name: Save llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/llama
          key: llama-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Restore Python
        id: python-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/python
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-python.sh

      - name: Save Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/python
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      # Built by the node job.
      - name: Restore Node.js
        uses: actions/cache/restore@v4
        with:
          path: third_party/nodejs-mobile
          key: nodejs-mobile-icu-${{ hashFiles('scripts/compile-nodejs.sh', 'scripts/build-nodejs.sh', 'scripts/patch-nodejs-host-tools.py', 'scripts/patch-zerofill-offsets.py') }}
          fail-on-cache-miss: true

      # The Rust library that signs extensions' macOS programs on the phone.
      - name: Restore program signer
        id: prepare-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/prepare
          key: prepare-${{ hashFiles('scripts/build-prepare.sh', 'NativeTools/prepare/Cargo.*', 'NativeTools/prepare/src/**') }}

      - name: Build program signer
        if: steps.prepare-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-prepare.sh

      - name: Save program signer
        if: steps.prepare-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/prepare
          key: prepare-${{ hashFiles('scripts/build-prepare.sh', 'NativeTools/prepare/Cargo.*', 'NativeTools/prepare/src/**') }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DuoCode.xcodeproj \
            -scheme DuoCode \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify --renderer github-actions

      - name: Package IPA
        run: bash scripts/package-ipa.sh build/Build/Products/Release-iphoneos/DuoCode.app dist/MobileStudio.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MobileStudio-ipa
          path: dist/MobileStudio.ipa

      # A version tag (v0.1.0) publishes a release with the app, the README's download. Its notes are
      # the version's section of CHANGELOG.md.
      - name: Release notes (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "Download \`MobileStudio.ipa\` below and install it with a sideloading tool. The [README](https://github.com/$REPO#installing) explains how, step by step."
            echo
            awk -v v="## ${VERSION#v}" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md
          } > dist/release-notes.md
          cat dist/release-notes.md
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mobile Studio ${{ github.ref_name }}
          files: dist/MobileStudio.ipa
          body_path: dist/release-notes.md

  # Builds run on Intel Macs, which GitHub has more of free; the build only takes a few minutes, so
  # starting soon matters more than a faster Mac. When they're all busy too, a job that waits too
  # long is cancelled ("not acquired by Runner"), and the same commit is built again on Apple silicon.
  fallback:
    needs: [node, editor-tests, build]
    # A job that never got a runner shows to the jobs after it as failed, not cancelled; the step
    # below checks it was the runner shortage (a failed build has nothing to retry).
    if: always() && github.event_name != 'pull_request' && (inputs.runner || 'macos-15-intel') == 'macos-15-intel' && needs.build.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - name: Build on Apple silicon if no Intel Mac was free
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          starved=
          for id in $(gh api "repos/$REPO/actions/runs/$RUN/jobs" --jq '.jobs[] | select(.conclusion == "cancelled") | .id'); do
            if gh api "repos/$REPO/check-runs/$id/annotations" --jq '.[].message' | grep -q "not acquired by Runner"; then starved=1; fi
          done
          if [ -z "$starved" ]; then echo "Cancelled for another reason (a newer push, or by hand): nothing to do."; exit 0; fi
          # A newer commit has its own build; don't start one for this one.
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$(gh api "repos/$REPO/commits/$REF" --jq .sha)" != "$SHA" ]; then
            echo "$REF has moved on from $SHA: skipping."; exit 0
          fi
          gh workflow run build-ipa.yml --repo "$REPO" --ref "$REF" -f runner=macos-15
          echo "Started the build again on macos-15 (Apple silicon)."
