<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- The editor itself is editor.bundle.js, built from Editor/ (npm run build). -->
<style>
  :root {
    color-scheme: dark;
    /* Overwritten by the editor theme (theme.js applyChrome). */
    --bg: #1e1e1e; --chrome: #252526; --fg: #d4d4d4; --text: #cccccc; --muted: #999999;
    --border: #454545; --border-strong: #1a1a1a;
    --c-func: #dcdcaa; --c-variable: #9cdcfe; --c-type: #4ec9b0; --c-constant: #4fc1ff;
  }
  /* VS Code's icon font (github.com/microsoft/vscode-codicons, CC BY 4.0). */
  @font-face { font-family: codicon; src: url(codicon.ttf) format('truetype'); }
  .codicon { font-family: codicon !important; font-style: normal; font-weight: normal; line-height: 1; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    background: var(--bg);
    color: var(--text);
    font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: none;
  }
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
  #tabbar {
    height: 35px; flex: none; display: flex; align-items: center; background: var(--chrome);
    border-bottom: 1px solid var(--border-strong); padding: 0 8px 0 0;
  }
  /* Editor tabs (tabs.js), as VS Code draws them. */
  .tabs { flex: 1; min-width: 0; align-self: stretch; display: flex; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: flex; align-items: center; gap: 6px; max-width: 220px; padding: 0 4px 0 10px; height: 100%;
    background: transparent; color: var(--muted); border-right: 1px solid var(--border-strong); border-top: 1px solid transparent;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; white-space: nowrap; cursor: pointer;
  }
  .tab.active { background: var(--bg); color: var(--fg); border-top-color: #007acc; }
  .tab.preview .tab-name { font-style: italic; }
  .tab-icon { flex: none; font-size: 12px; }
  .tab-name { overflow: hidden; text-overflow: ellipsis; }
  .tab-folder { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
  .tab-close { flex: none; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: none; color: inherit; opacity: .5; font: 15px -apple-system, sans-serif; line-height: 22px; }
  .tab.active .tab-close { opacity: 1; }
  .tab-close::before { content: '\ea76'; font-family: codicon; font-size: 16px; }
  .tab-close.dirty::before { content: '\ea71'; font-family: codicon; font-size: 16px; }
  .tab-close:active { background: rgba(90, 93, 94, .5); }
  /* Breadcrumbs (breadcrumbs.js) */
  .breadcrumbs { height: 22px; flex: none; display: flex; align-items: center; gap: 1px; padding: 0 12px; overflow-x: auto; overflow-y: hidden; white-space: nowrap; scrollbar-width: none; background: var(--bg); color: var(--muted); font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .breadcrumbs::-webkit-scrollbar { display: none; }
  .breadcrumbs[hidden] { display: none; }
  .crumb { display: flex; align-items: center; gap: 4px; padding: 0 2px; cursor: pointer; }
  .crumb:active { color: var(--fg); }
  .crumb-icon { font: 14px codicon; }
  .crumb-icon.file { color: #519aba; }
  .crumb-icon.function { color: #b180d7; }
  .crumb-icon.class { color: #ee9d28; }
  .crumb-sep { font: 14px codicon; opacity: .8; }
  /* Markdown preview (mdpreview.js), in VS Code's preview styles */
  .palette-button.on { color: var(--fg); }
  .palette-button[hidden] { display: none; }
  .md-preview { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); color: var(--text); z-index: 5; }
  .md-preview[hidden] { display: none; }
  #editor-container.md-side .cm-editor { width: 50%; }
  #editor-container.md-side .md-preview { left: 50%; border-left: 1px solid var(--border-strong); }
  .md-body { max-width: 880px; margin: 0 auto; padding: 16px 26px 40px; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-user-select: text; user-select: text; overflow-wrap: anywhere; }
  .md-body h1, .md-body h2 { padding-bottom: .3em; border-bottom: 1px solid rgba(128, 128, 128, .35); }
  .md-body h1 { font-size: 2em; margin: .2em 0 .6em; } .md-body h2 { font-size: 1.5em; margin: 1.2em 0 .6em; } .md-body h3 { font-size: 1.25em; }
  .md-body a { color: #3794ff; text-decoration: none; }
  .md-body code { font: 13px ui-monospace, Menlo, Consolas, monospace; background: rgba(128, 128, 128, .17); padding: 1px 4px; border-radius: 3px; }
  .md-body pre { background: rgba(128, 128, 128, .1); padding: 12px 14px; border-radius: 4px; overflow-x: auto; }
  .md-body pre code { background: none; padding: 0; white-space: pre; }
  .md-body blockquote { margin: 0 0 1em; padding: 0 1em; border-left: 4px solid rgba(0, 122, 204, .5); background: rgba(127, 127, 127, .1); }
  .md-body blockquote p { margin: .5em 0; }
  .md-body table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; }
  .md-body th, .md-body td { border: 1px solid rgba(128, 128, 128, .35); padding: 5px 10px; }
  .md-body th { background: rgba(128, 128, 128, .1); }
  .md-body hr { border: 0; height: 2px; background: rgba(128, 128, 128, .3); margin: 1.5em 0; }
  .md-body img { max-width: 100%; }
  .md-body img.missing { display: inline-block; min-width: 40px; min-height: 20px; border: 1px dashed rgba(128, 128, 128, .5); }
  .md-body li.task { list-style: none; margin-left: -1.3em; }
  /* Extensions' webview panels (ext/webviews.js) */
  .webviews { position: absolute; inset: 0; z-index: 6; background: #1e1e1e; }
  .webviews[hidden] { display: none; }
  .webview { width: 100%; height: 100%; border: 0; display: block; background: #1e1e1e; }
  .webview[hidden] { display: none; }
  #empty-editor { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 24px; line-height: 1.7; }
  #empty-editor[hidden] { display: none; }
  #empty-editor kbd { font: 11px ui-monospace, Menlo, monospace; background: rgba(128, 128, 128, .17); border-radius: 3px; padding: 1px 5px; border: 1px solid rgba(128, 128, 128, .3); }
  .cursor-pos { margin-left: auto; padding-left: 10px; flex: none; font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  /* Narrow panes (phone sidebar open, Duo half in landscape): keep the tab name readable. */
  @media (max-width: 300px) {
    .cursor-pos { display: none; }
    #tabbar { padding: 0 4px 0 0; }
  }
  .ai-busy { flex: none; margin-left: 8px; font-size: 11px; color: var(--muted); animation: ai-pulse 1s ease-in-out infinite alternate; }
  .ai-busy[hidden] { display: none; }
  @keyframes ai-pulse { from { opacity: .35; } to { opacity: 1; } }
  #editor-row { flex: 1; display: flex; min-height: 0; }
  #editor-container { flex: 1; position: relative; min-height: 0; min-width: 0; overflow: hidden; }
  /* View: Split Editor (split.js): side by side, or stacked on a narrow screen. */
  #side-editor { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--border-strong); background: var(--bg); }
  #side-editor[hidden] { display: none; }
  @media (max-width: 600px) { #editor-row.split { flex-direction: column; } #side-editor { border-left: 0; border-top: 1px solid var(--border-strong); } }
  .side-bar { height: 28px; flex: none; display: flex; align-items: center; background: var(--chrome); border-bottom: 1px solid var(--border-strong); padding: 0 4px 0 0; }
  .side-title { flex: 1; min-width: 0; height: 100%; text-align: left; padding: 0 10px; border: 0; background: none; color: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-button { flex: none; width: 26px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--text); font-size: 16px; }
  .side-button:active { background: rgba(90, 93, 94, .5); }
  #side-container { flex: 1; min-height: 0; position: relative; }
  #side-container .cm-editor { height: 100%; }
  /* The Output panel (ext/output.js). */
  .output-panel { flex: none; height: 34%; min-height: 120px; display: flex; flex-direction: column; background: var(--bg); border-top: 1px solid var(--border); }
  .output-panel[hidden] { display: none; }
  .output-bar { height: 30px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 16px; }
  .output-title { flex: 1; font-size: 11px; color: var(--fg); letter-spacing: .04em; border-bottom: 1px solid var(--fg); align-self: center; max-width: max-content; margin-right: auto; padding: 4px 0; }
  .output-bar select { max-width: 45%; height: 22px; background: var(--chrome); color: var(--text); border: 1px solid var(--border); border-radius: 2px; font: 12px -apple-system, sans-serif; }
  #output-text { flex: 1; min-height: 0; margin: 0; padding: 4px 16px 12px; overflow: auto; -webkit-overflow-scrolling: touch; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  #editor-container .cm-editor { height: 100%; }
  /* CodeMirror's base theme forces display:flex !important, so hiding needs the same weight. */
  #editor-container .cm-editor[hidden] { display: none !important; }
  .cm-content { -webkit-user-select: text; user-select: text; -webkit-touch-callout: none; }

  /* Merge conflicts, in VS Code's merge colours. */
  #editor-container .cm-conflict-current-header { background-color: rgba(64, 200, 174, .5) !important; }
  #editor-container .cm-conflict-current { background-color: rgba(64, 200, 174, .2) !important; }
  #editor-container .cm-conflict-incoming-header { background-color: rgba(64, 166, 255, .5) !important; }
  #editor-container .cm-conflict-incoming { background-color: rgba(64, 166, 255, .2) !important; }
  #editor-container .cm-conflict-base-header { background-color: rgba(96, 96, 96, .4) !important; }
  #editor-container .cm-conflict-base { background-color: rgba(96, 96, 96, .16) !important; }
  .cm-conflict-label { color: var(--muted); font-style: italic; margin-left: 10px; }
  .cm-conflict-actions { padding: 3px 0 1px 2px; font: 12px -apple-system, "Segoe UI", sans-serif; color: var(--muted); white-space: normal; }
  .cm-conflict-actions button { background: none; border: 0; padding: 3px 2px; font: inherit; color: var(--muted); cursor: pointer; }
  .cm-conflict-actions button:active { color: #3794ff; text-decoration: underline; }
  .cm-conflict-sep { margin: 0 4px; opacity: .6; }

  .merge-bar {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; min-height: 34px; padding: 3px 8px;
    background: var(--chrome); border-top: 1px solid var(--border-strong); font: 12px -apple-system, "Segoe UI", sans-serif; color: var(--text);
  }
  .merge-bar[hidden] { display: none; }
  .merge-count { white-space: nowrap; margin-right: 2px; }
  .merge-spacer { flex: 1; }
  .merge-icon { background: none; border: 0; color: var(--text); font-size: 15px; min-width: 28px; height: 28px; border-radius: 5px; padding: 0; }
  .merge-icon:active { background: rgba(90, 93, 94, .5); }
  .merge-icon:disabled { opacity: .35; }
  .merge-icon[hidden], .merge-button[hidden] { display: none; }
  .merge-button {
    background: #3a3d41; color: #fff; border: 0; border-radius: 2px; padding: 5px 10px; font: 12px -apple-system, "Segoe UI", sans-serif;
    white-space: nowrap;
  }
  .merge-button.primary { background: #0e639c; }
  .merge-button:active { filter: brightness(1.2); }
  .merge-button:disabled, .merge-button.off { opacity: .4; }
  .merge-menu {
    position: fixed; z-index: 60; display: flex; flex-direction: column; min-width: 190px; padding: 4px 0;
    background: #252526; border: 1px solid #454545; border-radius: 5px; box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .merge-menu[hidden] { display: none; }
  .merge-menu-item { background: none; border: 0; color: #ccc; text-align: left; padding: 7px 14px; font: 13px -apple-system, "Segoe UI", sans-serif; }
  .merge-menu-item:active { background: #04395e; color: #fff; }
  .merge-note {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 70; max-width: 86vw; padding: 7px 12px;
    background: #063b49; border: 1px solid #007fd4; color: #ccc; font: 12px -apple-system, "Segoe UI", sans-serif; border-radius: 3px;
  }
  .merge-note[hidden] { display: none; }

  /* The AI review sheet. */
  .ai-merge { max-height: 46%; }
  .ai-merge-head { display: flex; align-items: center; gap: 2px; padding: 6px 8px 2px; }
  .ai-merge-title { font: 600 12px -apple-system, "Segoe UI", sans-serif; color: var(--text); padding: 0 4px; }
  .ai-merge-where { font: 11px -apple-system, sans-serif; color: var(--muted); padding-right: 6px; }
  .ai-merge-body { flex: 1; min-height: 60px; overflow-y: auto; padding: 2px 12px 6px; -webkit-user-select: text; user-select: text; }
  .ai-merge-status { font: 12px -apple-system, "Segoe UI", sans-serif; color: var(--muted); margin: 4px 0 6px; }
  .ai-merge-status.working, .ai-merge-status.pending { animation: ai-pulse 1s ease-in-out infinite alternate; }
  .ai-merge-status.failed { color: #f48771; }
  .ai-merge-code {
    margin: 0; padding: 8px 10px; background: rgba(155, 185, 85, .16); border-left: 3px solid #487e02; color: var(--fg);
    font: 12px ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow-x: auto; tab-size: 4;
  }
  .ai-merge-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }

  /* Inline diff (Source Control), in VS Code's diff editor colours. */
  #editor-container .cm-changedLine, #editor-container .cm-inlineChangedLine { background-color: rgba(155, 185, 85, .2) !important; }
  #editor-container .cm-changedText { background: rgba(156, 204, 44, .3) !important; }
  #editor-container .cm-deletedChunk { background-color: rgba(255, 0, 0, .2) !important; padding-left: 0 !important; }
  #editor-container .cm-deletedChunk .cm-deletedText { background: rgba(255, 0, 0, .3) !important; }
  #editor-container .cm-changeGutter { width: 3px; padding-left: 0; }
  #editor-container .cm-changedLineGutter { background: #487e02 !important; }
  #editor-container .cm-deletedLineGutter { background: #f14c4c !important; }

  /* Signature help, hover docs, completion info */
  .dc-signature { padding: 5px 9px; max-width: min(520px, 92vw); font: 12px ui-monospace, Menlo, Consolas, monospace; }
  .dc-sig b { color: var(--c-constant); font-weight: 600; }
  .dc-param { font: 12px -apple-system, sans-serif; color: var(--text); margin-top: 3px; }
  .dc-more { color: var(--muted); font-size: 11px; }
  .dc-hover { padding: 6px 10px; max-width: min(440px, 90vw); }
  .dc-signature-line { display: block; font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--c-func); margin: 2px 0 6px; overflow-wrap: anywhere; }
  .dc-type { color: var(--c-type); }
  .dc-muted { color: var(--muted); }
  .dc-hover p, .cm-completionInfo p, .dc-sheet p { margin: 4px 0; line-height: 1.45; color: var(--text); font-size: 12px; }

  /* Long-press docs sheet */
  .dc-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 55%; z-index: 50; display: flex; flex-direction: column;
    background: var(--chrome); border-top: 1px solid var(--border); border-radius: 12px 12px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,.55); transform: translateY(100%); transition: transform .2s ease;
  }
  .dc-sheet.open { transform: translateY(0); }
  .dc-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 4px 14px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .dc-close { background: none; border: 0; color: var(--muted); font-size: 15px; width: 36px; height: 32px; }
  .dc-sheet-body { overflow-y: auto; padding: 0 14px 18px; -webkit-user-select: text; user-select: text; }
  .dc-sheet dl { margin: 6px 0; }
  .dc-sheet dt { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--c-variable); margin-top: 6px; }
  .dc-sheet dd { margin: 2px 0 0 12px; color: var(--text); font-size: 12px; line-height: 1.4; }
  .dc-sheet h4 { margin: 12px 0 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .dc-returns { margin-top: 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .dc-link { display: inline-block; margin-top: 10px; color: #3794ff; text-decoration: none; font-size: 13px; }

  .palette-button { flex: none; margin-left: 6px; background: none; border: 0; color: var(--muted); font: 16px codicon; width: 30px; height: 28px; border-radius: 4px; padding: 0; }
  .palette-button:active { background: rgba(90, 93, 94, .5); color: var(--fg); }
  /* VS Code's find widget (findwidget.js), floating at the top right over the text */
  #editor-container .cm-panels.cm-panels-top { position: absolute; top: 0; right: 14px; left: auto; z-index: 20; background: none; border: 0; max-width: calc(100% - 20px); }
  .dc-find {
    display: flex; align-items: flex-start; gap: 2px; padding: 4px 4px 4px 2px; background: #252526; color: #ccc;
    box-shadow: 0 0 8px 2px rgba(0, 0, 0, .36); border-radius: 0 0 4px 4px; font: 13px -apple-system, "Segoe UI", sans-serif;
  }
  .dc-find-toggle { width: 18px; align-self: stretch; border: 0; border-radius: 3px; background: none; color: #ccc; font: 16px codicon; padding: 0; }
  .dc-find-toggle:active { background: rgba(90, 93, 94, .5); }
  .dc-find-rows { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .dc-find-row { display: flex; align-items: center; gap: 2px; }
  .dc-find-row[hidden] { display: none; }
  .dc-find-field { display: flex; align-items: center; width: min(230px, 46vw); height: 26px; background: #3c3c3c; border: 1px solid transparent; border-radius: 2px; }
  .dc-find-field:focus-within { border-color: #007fd4; }
  .no-results .dc-find-row:first-child .dc-find-field { border-color: #be1100; }
  .dc-find-input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; color: #ccc; padding: 0 4px; font: 13px -apple-system, "Segoe UI", sans-serif; -webkit-user-select: text; user-select: text; }
  .dc-find-option { flex: none; width: 22px; height: 20px; margin-right: 2px; border: 1px solid transparent; border-radius: 3px; background: none; color: #ccc; font: 600 11px -apple-system, "Segoe UI", sans-serif; padding: 0; }
  .dc-find-option.word { text-decoration: underline; }
  .dc-find-option.on { background: rgba(36, 137, 219, .51); border-color: #007acc; color: #fff; }
  .dc-find-count { min-width: 64px; padding: 0 6px; font-size: 12px; color: #ccc; white-space: nowrap; }
  .no-results .dc-find-count { color: #f48771; }
  .dc-find-action { flex: none; min-width: 24px; height: 24px; border: 0; border-radius: 4px; background: none; color: #ccc; font: 16px codicon; padding: 0 3px; }
  .dc-find-action.text { font: 12px -apple-system, "Segoe UI", sans-serif; padding: 0 6px; }
  .dc-find-action:active { background: rgba(90, 93, 94, .5); }
  @media (max-width: 420px) { .dc-find-count { min-width: 0; } }

  /* Source control change markers (gitgutter.js), in VS Code's colours */
  .cm-change-gutter { width: 5px; }
  .cm-change-gutter .cm-gutterElement { position: relative; }
  .cm-change { position: absolute; left: 1px; top: 0; bottom: 0; width: 3px; }
  .cm-change.added { background: #487e02; }
  .cm-change.modified { background: #1b81a8; }
  .cm-change.deleted { top: auto; bottom: calc(100% - 4px); width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid #f14c4c; background: none; }

  /* Debugger: breakpoint gutter, paused line */
  .cm-breakpoint-gutter { width: 14px; cursor: pointer; }
  .cm-lineNumbers .cm-gutterElement { cursor: pointer; }
  /* Fingers need a bigger target than a pointer. */
  @media (pointer: coarse) {
    .cm-breakpoint-gutter { width: 22px; }
    .cm-breakpoint { width: 11px; height: 11px; }
    .cm-lineNumbers .cm-gutterElement { padding: 0 6px 0 4px; }
  }
  .cm-breakpoint-gutter .cm-gutterElement { display: flex; align-items: center; justify-content: center; }
  .cm-breakpoint { width: 9px; height: 9px; border-radius: 50%; background: #e51400; }
  .cm-breakpoint.conditional { background: #e51400; box-shadow: inset 0 0 0 2px #e51400, inset 0 -3px 0 -1px #1e1e1e, inset 0 3px 0 -1px #1e1e1e; }
  .cm-breakpoint.log { border-radius: 1px; transform: rotate(45deg) scale(.85); }
  .cm-breakpoint.disabled { background: #848484; }
  .cm-paused-arrow { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid #ffcc00; }
  .cm-breakpoint-gutter .cm-gutterElement:has(.cm-paused-arrow) .cm-breakpoint { display: none; }
  .cm-inline-values { margin-left: 2em; color: #c586c0; opacity: .75; font-style: italic; white-space: pre; pointer-events: none; }
  #editor-container .cm-paused-line { background-color: rgba(255, 255, 0, .2) !important; outline: 1px solid rgba(255, 204, 0, .5); }

  /* Quick input (Command Palette, quick picks, input boxes), as in VS Code. */
  .qi-backdrop { position: fixed; inset: 0; z-index: 80; }
  .qi {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: min(600px, calc(100vw - 16px));
    display: flex; flex-direction: column; max-height: min(440px, 70vh); padding: 6px 0 4px;
    background: #252526; color: #ccc; border-radius: 6px; box-shadow: 0 0 12px rgba(0,0,0,.6); border: 1px solid #454545;
    font: 13px -apple-system, "Segoe UI", sans-serif;
  }
  .qi-row { display: flex; gap: 6px; padding: 0 6px 4px; }
  .qi-input {
    flex: 1; min-width: 0; height: 28px; padding: 0 6px; background: #3c3c3c; color: #ccc; border: 1px solid #0078d4;
    border-radius: 2px; outline: none; font: 13px -apple-system, "Segoe UI", sans-serif; -webkit-user-select: text; user-select: text;
  }
  .qi-ok { background: #0e639c; color: #fff; border: 0; border-radius: 2px; padding: 0 12px; font: inherit; }
  .qi-prompt { padding: 2px 11px 6px; font-size: 12px; color: #9d9d9d; }
  .qi-list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .qi-item { display: flex; align-items: center; gap: 6px; padding: 0 11px; min-height: 30px; }
  .qi-item.selected { background: #04395e; color: #fff; }
  .qi-item:active { background: #04395e; }
  .qi-text { flex: 1; min-width: 0; padding: 4px 0; }
  .qi-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qi-label b { color: #2aaaff; font-weight: 600; }
  .qi-description { margin-left: 8px; font-size: 12px; color: #9d9d9d; }
  .qi-detail { font-size: 11px; color: #9d9d9d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qi-key { flex: none; font: 11px ui-monospace, Menlo, monospace; color: #9d9d9d; }
  .qi-check { flex: none; font-size: 15px; }
  .qi-separator { padding: 6px 11px 2px; font-size: 11px; color: #9d9d9d; border-top: 1px solid #3c3c3c; margin-top: 2px; text-align: right; }
  .qi-empty { padding: 6px 11px; color: #9d9d9d; }

  /* Notifications */
  .notifications { position: fixed; right: 8px; bottom: 8px; z-index: 75; display: flex; flex-direction: column; gap: 6px; width: min(420px, calc(100vw - 16px)); }
  .toast { background: #252526; color: #ccc; border: 1px solid #303031; border-radius: 4px; box-shadow: 0 0 8px rgba(0,0,0,.6); font: 13px -apple-system, "Segoe UI", sans-serif; }
  .toast-head { display: flex; align-items: flex-start; gap: 8px; padding: 10px 6px 10px 10px; }
  .toast-icon { flex: none; font-size: 15px; line-height: 17px; }
  .toast-icon.info { color: #3794ff; } .toast-icon.warning { color: #cca700; } .toast-icon.error { color: #f14c4c; }
  .toast-text { flex: 1; min-width: 0; line-height: 17px; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  .toast-close { flex: none; background: none; border: 0; color: #ccc; width: 26px; height: 22px; font-size: 12px; }
  .toast-buttons { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px; }
  .toast-button { background: #3a3d41; color: #fff; border: 0; border-radius: 2px; padding: 5px 12px; font: 12px -apple-system, "Segoe UI", sans-serif; }
  .toast-button.primary { background: #0e639c; }

  /* Extension status bar items and hovers */
  .ext-status { display: flex; gap: 2px; margin-left: auto; min-width: 0; overflow: hidden; }
  .ext-status + .cursor-pos { margin-left: 0; }
  .ext-status-item { background: none; border: 0; color: var(--muted); font: 11px -apple-system, "Segoe UI", sans-serif; padding: 2px 5px; white-space: nowrap; border-radius: 3px; }
  .ext-status-item:active { background: rgba(90, 93, 94, .5); }
  .ext-status-item:disabled { opacity: 1; }
  .ext-hover { max-height: 40vh; overflow-y: auto; -webkit-user-select: text; user-select: text; }
  .ext-hover code { font: 12px ui-monospace, Menlo, Consolas, monospace; }
  .ext-code { margin: 4px 0; padding: 4px 0; font: 12px ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: var(--c-func); }

  /* Read-only viewer for images, audio, video, fonts and other binary files. */
  #viewer { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  #viewer[hidden] { display: none; }
  #viewer-stage { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 16px; }
  #viewer-stage > * { margin: auto; }
  #viewer-stage.checker {
    background-color: #2a2a2a;
    background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%),
                      linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }
  #viewer-stage img.fit { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer-stage img.pixelated { image-rendering: pixelated; }
  #viewer-stage audio, #viewer-stage video { max-width: 100%; }
  #viewer-bar {
    flex: none; display: flex; align-items: center; gap: 12px; min-height: 30px; padding: 4px 12px;
    background: var(--chrome); border-top: 1px solid var(--border-strong); font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted);
  }
  #viewer-info { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #viewer-zoom { display: flex; gap: 2px; flex: none; }
  #viewer-zoom[hidden] { display: none; }
  #viewer-zoom button { font: inherit; color: #ccc; background: #333; border: 0; border-radius: 3px; padding: 4px 8px; min-width: 32px; }
  #viewer-zoom button.on { background: #0e639c; color: #fff; }
  .card { text-align: center; color: var(--muted); max-width: 320px; line-height: 1.5; }
  .card .glyph { font-size: 40px; margin-bottom: 8px; }
  .card b { color: var(--fg); }
  .font-sample { color: var(--fg); max-width: 100%; overflow-wrap: anywhere; line-height: 1.3; }
  .font-sample p { margin: 0 0 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="tabbar">
    <div id="tabs" class="tabs"></div>
    <span id="pos" class="cursor-pos"></span>
    <span id="ai-busy" class="ai-busy" hidden title="AI is thinking">✦</span>
    <button id="md-toggle" class="palette-button" title="Open Preview (⇧⌘V)" aria-label="Open Preview" hidden>&#xEB2F;</button>
    <button id="palette" class="palette-button" title="Command Palette (⇧⌘P)" aria-label="Command Palette">&#xEA6D;</button>
  </div>
  <div id="breadcrumbs" class="breadcrumbs" hidden></div>
  <div id="editor-row">
  <div id="editor-container">
    <div id="md-preview" class="md-preview" hidden></div>
    <div id="webviews" class="webviews" hidden></div>
    <div id="empty-editor" hidden><div>No editor is open.<br>Open a file from the Explorer, or press <kbd>⌘P</kbd> to go to one.</div></div>
    <div id="viewer" hidden>
      <div id="viewer-stage"></div>
      <div id="viewer-bar">
        <span id="viewer-info"></span>
        <span id="viewer-zoom" hidden>
          <button data-zoom="fit" class="on">Fit</button><button data-zoom="1">1×</button><button data-zoom="2">2×</button><button data-zoom="4">4×</button><button data-zoom="8">8×</button>
        </span>
      </div>
    </div>
  </div>
  <div id="side-editor" hidden>
    <div class="side-bar"><button id="side-title" class="side-title" title="Open a file here"></button><button id="side-close" class="codicon side-button" title="Close Split Editor" aria-label="Close Split Editor">&#xEA76;</button></div>
    <div id="side-container"></div>
  </div>
  </div>
  <div id="output-panel" class="output-panel" hidden>
    <div class="output-bar">
      <span class="output-title">OUTPUT</span>
      <select id="output-channel" aria-label="Output channel"></select>
      <button id="output-clear" class="codicon side-button" title="Clear Output" aria-label="Clear Output">&#xEABF;</button>
      <button id="output-close" class="codicon side-button" title="Close Panel" aria-label="Close Panel">&#xEA76;</button>
    </div>
    <pre id="output-text"></pre>
  </div>
</div>
<script src="editor.bundle.js"></script>
</body>
</html>
